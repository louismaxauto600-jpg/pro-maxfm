<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#FF8C00,#7A3B00 48%,#000);background-attachment:fixed;color:#FFD6A0;font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
a{text-decoration:none;color:#FFD6A0}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:#090300;border-bottom:2px solid #FF8C00;position:sticky;top:0;z-index:10}

.right{display:flex;gap:12px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:rgba(0,0,0,.72);border:1px solid rgba(255,140,0,.45);border-radius:18px;padding:22px;min-height:130px}
.card h3{color:#FF8C00;margin-bottom:10px}

</head>

</div>
